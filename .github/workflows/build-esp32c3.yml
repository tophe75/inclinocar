name: Build ESP32-C3 Firmware

on:
  push:
    tags:
      - 'fw-esp32c3-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-esp32c3-${{ hashFiles('firmware/firmware-esp32c3/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Set version from tag
        run: |
          TAG=${GITHUB_REF#refs/tags/fw-esp32c3-}
          python3 scripts/set_version.py "$TAG" firmware/firmware-esp32c3/platformio.ini
          echo "Version: $TAG"

      - name: Build firmware
        run: cd firmware/firmware-esp32c3 && pio run

      - name: Copy binaries
        run: |
          mkdir -p docs/bins/esp32c3
          cp firmware/firmware-esp32c3/.pio/build/esp32-c3-devkitm-1/bootloader.bin docs/bins/esp32c3/
          cp firmware/firmware-esp32c3/.pio/build/esp32-c3-devkitm-1/partitions.bin  docs/bins/esp32c3/
          cp firmware/firmware-esp32c3/.pio/build/esp32-c3-devkitm-1/firmware.bin    docs/bins/esp32c3/

      - name: Update manifest
        run: |
          TAG=${GITHUB_REF#refs/tags/fw-esp32c3-}
          VER=${TAG#v}
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VER}\"/" docs/manifest-esp32c3.json

      - name: Commit binaries
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/bins/esp32c3/ docs/manifest-esp32c3.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          # Other per-target CI jobs may push to main concurrently. Re-point HEAD at
          # the latest main tip each retry and recommit our staged changes on top —
          # safe since this job only ever touches its own disjoint
          # docs/bins/esp32c3/ + manifest path, and --soft reset needs no shared
          # history graph (unlike rebase), which matters since actions/checkout
          # gives a shallow clone by default.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --soft origin/main
            git commit -m "ci: esp32c3 ${GITHUB_REF#refs/tags/}"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push after retries" >&2
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: InclinoCore ESP32-C3 ${{ github.ref_name }}
          body: |
            Flash via the [Web Installer](https://tophe75.github.io/inclinocar/) using Chrome or Edge.
            Select **ESP32-C3 Super Mini** from the hardware dropdown.
          files: |
            docs/bins/esp32c3/bootloader.bin
            docs/bins/esp32c3/partitions.bin
            docs/bins/esp32c3/firmware.bin
