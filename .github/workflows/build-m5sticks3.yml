name: Build M5StickS3 Firmware

on:
  push:
    tags:
      - 'fw-m5sticks3-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-m5sticks3-${{ hashFiles('firmware/firmware-m5sticks3/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Set version from tag
        run: |
          TAG=${GITHUB_REF#refs/tags/fw-m5sticks3-}
          python3 scripts/set_version.py "$TAG" firmware/firmware-m5sticks3/platformio.ini
          echo "Version: $TAG"

      - name: Build firmware
        run: cd firmware/firmware-m5sticks3 && pio run

      - name: Copy binaries, update manifest, and commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG=${GITHUB_REF#refs/tags/fw-m5sticks3-}
          VER=${TAG#v}
          BOOT_APP0=$(find ~/.platformio -name "boot_app0.bin" | head -1)
          # Other per-target CI jobs may push to main concurrently. Rebuild docs/bins
          # and the manifest fresh on top of the latest main each retry, using
          # `git reset --hard` rather than `--soft` — soft leaves the index (and
          # therefore what gets committed) tied to whatever main looked like at
          # checkout time, which silently reverts any OTHER target's files that
          # changed on main in the meantime. Hard reset + re-copy avoids that
          # entirely: every retry starts from an index that exactly matches the
          # latest main, so only this target's paths ever end up in the diff.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p docs/bins/m5sticks3
            cp firmware/firmware-m5sticks3/.pio/build/m5stack-sticks3/bootloader.bin docs/bins/m5sticks3/
            cp firmware/firmware-m5sticks3/.pio/build/m5stack-sticks3/partitions.bin  docs/bins/m5sticks3/
            cp firmware/firmware-m5sticks3/.pio/build/m5stack-sticks3/firmware.bin    docs/bins/m5sticks3/
            # boot_app0.bin required for ESP32-S3 OTA boot
            [ -n "$BOOT_APP0" ] && cp "$BOOT_APP0" docs/bins/m5sticks3/
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VER}\"/" docs/manifest-m5sticks3.json
            git add docs/bins/m5sticks3/ docs/manifest-m5sticks3.json
            if git diff --cached --quiet; then
              echo "Nothing to commit"
              exit 0
            fi
            git commit -m "ci: m5sticks3 ${GITHUB_REF#refs/tags/}"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push after retries" >&2
          exit 1

      - name: Generate changelog
        run: |
          git fetch --tags --unshallow origin 2>/dev/null || git fetch --tags origin
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag -l 'fw-m5sticks3-v*' --sort=-creatordate | grep -Fxv "$CURRENT_TAG" | head -1)
          {
            echo "Flash via the [Web Installer](https://tophe75.github.io/inclinocar/) using Chrome or Edge."
            echo "Select **M5StickS3** from the hardware dropdown."
            echo ""
            echo "## What's Changed"
            if [ -n "$PREV_TAG" ]; then
              LOG=$(git log --pretty=format:'- %s' "${PREV_TAG}..${CURRENT_TAG}" -- firmware/firmware-m5sticks3/ 2>/dev/null)
              if [ -n "$LOG" ]; then
                echo "$LOG"
              else
                echo "No source changes for this target since ${PREV_TAG}."
              fi
            else
              echo "First release for this target."
            fi
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: InclinoCore M5StickS3 ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            docs/bins/m5sticks3/bootloader.bin
            docs/bins/m5sticks3/partitions.bin
            docs/bins/m5sticks3/firmware.bin
