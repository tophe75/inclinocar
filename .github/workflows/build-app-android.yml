name: Build Android App

on:
  push:
    tags:
      - 'v*'
      - 'app-v*'
      - 'android-v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG=${TAG#app-}
          TAG=${TAG#android-}
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Update app version
        run: |
          TAG=${{ steps.version.outputs.tag }}
          if [[ "$TAG" == v* ]]; then
            VER=${TAG#v}
            sed -i "s/^version: .*/version: ${VER}+1/" app/pubspec.yaml
            sed -i "s/const String kAppVersion = '[^']*'/const String kAppVersion = '${VER}'/" app/lib/main.dart
          fi

      - name: Write local.properties
        run: |
          FLUTTER_PATH=$(which flutter | xargs dirname | xargs dirname)
          echo "flutter.sdk=$FLUTTER_PATH" > app/android/local.properties

      - name: Install dependencies
        run: cd app && flutter pub get

      - name: Build APK
        run: |
          cd app && flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/InclinoCar-installer.apk

      - name: Generate changelog
        run: |
          git fetch --tags --unshallow origin 2>/dev/null || git fetch --tags origin
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag -l 'android-v*' --sort=-creatordate | grep -Fxv "$CURRENT_TAG" | head -1)
          {
            echo "**Android APK**"
            echo ""
            echo "**Install instructions:**"
            echo "1. Download \`app-release.apk\` below"
            echo "2. On your Android phone: Settings → Security → Install unknown apps → allow your browser"
            echo "3. Open the downloaded APK and tap Install"
            echo ""
            echo "## What's Changed"
            if [ -n "$PREV_TAG" ]; then
              LOG=$(git log --pretty=format:'- %s' "${PREV_TAG}..${CURRENT_TAG}" -- app/ 2>/dev/null)
              if [ -n "$LOG" ]; then
                echo "$LOG"
              else
                echo "No app changes since ${PREV_TAG}."
              fi
            else
              echo "First release for this target."
            fi
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: InclinoCar Android ${{ github.ref_name }}
          body_path: release-notes.md
          files: app/build/app/outputs/flutter-apk/InclinoCar-installer.apk
