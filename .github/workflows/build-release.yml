name: Build & Release Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:

jobs:
  build-firmware:
    name: Build ESP32 Firmware (${{ matrix.unit }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: core
            project: firmware/core
          - unit: satellite
            project: firmware/satellite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}
          restore-keys: platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio && pio --version

      - name: Build ${{ matrix.unit }} firmware
        working-directory: ${{ matrix.project }}
        run: pio run -v

      - name: Collect binaries
        run: |
          mkdir -p dist/${{ matrix.unit }}
          BUILD=${{ matrix.project }}/.pio/build/esp32-c3-devkitm-1
          cp ${BUILD}/bootloader.bin  dist/${{ matrix.unit }}/${{ matrix.unit }}-bootloader.bin
          cp ${BUILD}/partitions.bin  dist/${{ matrix.unit }}/${{ matrix.unit }}-partitions.bin
          cp ${BUILD}/firmware.bin    dist/${{ matrix.unit }}/${{ matrix.unit }}-firmware.bin
          ls -lh dist/${{ matrix.unit }}/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.unit }}
          path: dist/${{ matrix.unit }}/
          retention-days: 7

  publish:
    name: Publish Release & Update Web Installer
    needs: build-firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Download core artifacts
        uses: actions/download-artifact@v7
        with:
          name: firmware-core
          path: dist/core/

      - name: Download satellite artifacts
        uses: actions/download-artifact@v7
        with:
          name: firmware-satellite
          path: dist/satellite/

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=dev-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: Copy binaries into docs/bins for GitHub Pages
        run: |
          mkdir -p docs/bins
          cp dist/core/core-bootloader.bin            docs/bins/
          cp dist/core/core-partitions.bin            docs/bins/
          cp dist/core/core-firmware.bin              docs/bins/
          cp dist/satellite/satellite-bootloader.bin  docs/bins/
          cp dist/satellite/satellite-partitions.bin  docs/bins/
          cp dist/satellite/satellite-firmware.bin    docs/bins/
          echo "${{ steps.tag.outputs.tag }}" > docs/bins/version.txt
          ls -lh docs/bins/

      - name: Commit binaries to main branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/bins/
          git diff --staged --quiet || git commit -m "ci: update firmware bins to ${{ steps.tag.outputs.tag }}"
          git push origin main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: InclinoCar ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            ## InclinoCar Firmware ${{ steps.tag.outputs.tag }}

            Flash using the **[Web Installer](https://tophe75.github.io/inclinocar/)** — works directly in Chrome/Edge, no drivers needed.

            Or flash manually with esptool:
            ```bash
            # Core Unit
            esptool.py --chip esp32c3 write_flash \
              0x00000 core-bootloader.bin \
              0x08000 core-partitions.bin \
              0x10000 core-firmware.bin

            # Satellite Display Unit
            esptool.py --chip esp32c3 write_flash \
              0x00000 satellite-bootloader.bin \
              0x08000 satellite-partitions.bin \
              0x10000 satellite-firmware.bin
            ```
          files: |
            dist/core/core-bootloader.bin
            dist/core/core-partitions.bin
            dist/core/core-firmware.bin
            dist/satellite/satellite-bootloader.bin
            dist/satellite/satellite-partitions.bin
            dist/satellite/satellite-firmware.bin
