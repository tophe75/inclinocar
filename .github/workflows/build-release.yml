name: Build & Release Firmware

on:
  push:
    tags:
      - 'v*'          # Trigger on version tags: v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  build-firmware:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - unit: core
            project: firmware/core
          - unit: satellite
            project: firmware/satellite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ${{ matrix.unit }} firmware
        working-directory: ${{ matrix.project }}
        run: pio run

      - name: Collect binaries
        run: |
          mkdir -p dist/${{ matrix.unit }}
          # PlatformIO output for ESP32-C3
          cp ${{ matrix.project }}/.pio/build/esp32-c3-devkitm-1/bootloader.bin  dist/${{ matrix.unit }}/${{ matrix.unit }}-bootloader.bin
          cp ${{ matrix.project }}/.pio/build/esp32-c3-devkitm-1/partitions.bin  dist/${{ matrix.unit }}/${{ matrix.unit }}-partitions.bin
          cp ${{ matrix.project }}/.pio/build/esp32-c3-devkitm-1/firmware.bin    dist/${{ matrix.unit }}/${{ matrix.unit }}-firmware.bin
          echo "--- Built binaries ---"
          ls -lh dist/${{ matrix.unit }}/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.unit }}
          path: dist/${{ matrix.unit }}/
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build-firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download core artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-core
          path: dist/core/

      - name: Download satellite artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-satellite
          path: dist/satellite/

      - name: List release assets
        run: ls -lh dist/core/ dist/satellite/

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=dev-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: InclinoCar ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            ## InclinoCar Firmware ${{ steps.tag.outputs.tag }}

            ### Flashing
            Use the **[Web Installer](https://tophe75.github.io/inclinocar/)** to flash directly from your browser (Chrome/Edge only).

            Or flash manually with esptool:
            ```bash
            # Core Unit
            esptool.py --chip esp32c3 write_flash \
              0x0000  core-bootloader.bin \
              0x8000  core-partitions.bin \
              0x10000 core-firmware.bin

            # Satellite Unit
            esptool.py --chip esp32c3 write_flash \
              0x0000  satellite-bootloader.bin \
              0x8000  satellite-partitions.bin \
              0x10000 satellite-firmware.bin
            ```

            ### Assets
            | File | Unit | Offset |
            |------|------|--------|
            | `core-bootloader.bin`       | Core      | 0x00000 |
            | `core-partitions.bin`       | Core      | 0x08000 |
            | `core-firmware.bin`         | Core      | 0x10000 |
            | `satellite-bootloader.bin`  | Satellite | 0x00000 |
            | `satellite-partitions.bin`  | Satellite | 0x08000 |
            | `satellite-firmware.bin`    | Satellite | 0x10000 |
          files: |
            dist/core/core-bootloader.bin
            dist/core/core-partitions.bin
            dist/core/core-firmware.bin
            dist/satellite/satellite-bootloader.bin
            dist/satellite/satellite-partitions.bin
            dist/satellite/satellite-firmware.bin
