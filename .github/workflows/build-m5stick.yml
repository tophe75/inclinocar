name: Build M5StickC Plus Firmware

on:
  push:
    tags:
      - 'fw-m5stick-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-m5stick-${{ hashFiles('firmware/firmware-m5stick/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Set version from tag
        run: |
          TAG=${GITHUB_REF#refs/tags/fw-m5stick-}
          python3 scripts/set_version.py "$TAG" firmware/firmware-m5stick/platformio.ini
          echo "Version: $TAG"

      - name: Build firmware
        run: cd firmware/firmware-m5stick && pio run

      - name: Copy binaries
        run: |
          mkdir -p docs/bins/m5stick
          cp firmware/firmware-m5stick/.pio/build/m5stick-c-plus/bootloader.bin docs/bins/m5stick/
          cp firmware/firmware-m5stick/.pio/build/m5stick-c-plus/partitions.bin  docs/bins/m5stick/
          cp firmware/firmware-m5stick/.pio/build/m5stick-c-plus/firmware.bin    docs/bins/m5stick/
          # boot_app0.bin required for ESP32 OTA boot
          find ~/.platformio -name "boot_app0.bin" | head -1 | xargs -I{} cp {} docs/bins/m5stick/

      - name: Update manifest
        run: |
          TAG=${GITHUB_REF#refs/tags/fw-m5stick-}
          VER=${TAG#v}
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VER}\"/" docs/manifest-m5stick.json

      - name: Commit binaries
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/bins/m5stick/ docs/manifest-m5stick.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "ci: m5stick ${GITHUB_REF#refs/tags/}"
          # actions/checkout defaults to a shallow clone; rebase needs full history
          # to find the real merge base with origin/main.
          git fetch --unshallow origin 2>/dev/null || true
          # Other per-target CI jobs may push to main concurrently — rebase and retry
          # instead of --force, so parallel tag pushes don't clobber each other's commits.
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push after retries" >&2
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: InclinoCore M5StickC Plus ${{ github.ref_name }}
          body: |
            Flash via the [Web Installer](https://tophe75.github.io/inclinocar/) using Chrome or Edge.
            Select **M5StickC Plus** from the hardware dropdown.
          files: |
            docs/bins/m5stick/bootloader.bin
            docs/bins/m5stick/partitions.bin
            docs/bins/m5stick/firmware.bin
