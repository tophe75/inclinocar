name: Build & Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Cache PlatformIO
        uses: actions/cache@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Set version from tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" == v* ]]; then
            sed -i "s/-DFW_VERSION='\"[^\"]*\"'/-DFW_VERSION='\"${TAG}\"'/" firmware/platformio.ini
            echo "Version set to ${TAG}"
            grep FW_VERSION firmware/platformio.ini
          fi

      - name: Build firmware
        run: cd firmware && pio run

      - name: Copy binaries to docs/bins
        run: |
          mkdir -p docs/bins
          cp firmware/.pio/build/esp32-c3-devkitm-1/bootloader.bin docs/bins/
          cp firmware/.pio/build/esp32-c3-devkitm-1/partitions.bin docs/bins/
          cp firmware/.pio/build/esp32-c3-devkitm-1/firmware.bin   docs/bins/
          ls -lh docs/bins/

      - name: Update manifest version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" == v* ]]; then
            VER=${TAG#v}
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VER}\"/" docs/manifest.json
            echo "Manifest version set to ${VER}"
          fi

      - name: Commit binaries
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/bins/ docs/manifest.json
          git diff --staged --quiet || git commit -m "ci: firmware ${GITHUB_REF#refs/tags/}"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: InclinoCar ${{ github.ref_name }}
          body: |
            Flash via the [Web Installer](https://tophe75.github.io/inclinocar/) using Chrome or Edge.
          files: |
            docs/bins/bootloader.bin
            docs/bins/partitions.bin
            docs/bins/firmware.bin
