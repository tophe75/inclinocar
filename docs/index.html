<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InclinoCar — Web Installer</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    :root {
      --green: #4caf50;
      --bg:    #0d1a0d;
      --card:  #111e11;
      --text:  #c8e6c8;
      --dim:   #5a8a5a;
      --border:#1e3a1e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 2.2rem; font-weight: 200; letter-spacing: 6px; color: var(--green); margin-bottom: 6px; }
    .tagline { color: var(--dim); font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 28px; }

    .selector-group { text-align: left; margin-bottom: 14px; }
    .selector-group label { display: block; font-size: 0.75rem; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }

    .hw-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
    .hw-btn {
      flex: 1;
      padding: 10px 6px;
      background: #0a120a;
      color: var(--dim);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: inherit;
      transition: all 0.15s;
    }
    .hw-btn.active {
      background: #1a4a1a;
      color: var(--green);
      border-color: var(--green);
    }
    .hw-btn:hover:not(.active) { border-color: var(--dim); color: var(--text); }

    select {
      width: 100%;
      background: #0a120a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.9rem;
      font-family: inherit;
      appearance: none;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: var(--green); }

    .info {
      background: #0a120a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 0.82rem;
      color: var(--dim);
      line-height: 1.6;
      text-align: left;
      min-height: 40px;
    }
    .info strong { color: var(--text); }

    esp-web-install-button { display: block; margin-bottom: 16px; }
    esp-web-install-button::part(button) {
      background: #1a4a1a;
      color: var(--green);
      border: 1px solid var(--green);
      border-radius: 8px;
      padding: 14px 28px;
      font-size: 1rem;
      font-family: inherit;
      letter-spacing: 1px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    esp-web-install-button::part(button):hover { background: #254a25; }

    .footer { font-size: 0.75rem; color: var(--dim); }
    .footer a { color: var(--dim); }
    .badge { display: inline-block; font-size: 0.7rem; padding: 2px 7px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
    .badge-latest { background: #1a4a1a; color: var(--green); border: 1px solid var(--green); }
    .badge-old    { background: #0a120a; color: var(--dim);   border: 1px solid var(--border); }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">INCLINOCAR</div>
  <div class="tagline">Rooftop Tent Leveling System</div>

  <!-- Hardware selector -->
  <div class="selector-group">
    <label>Hardware</label>
    <div class="hw-toggle">
      <button class="hw-btn active" id="btn-esp32c3" onclick="selectHardware('esp32c3')">
        ESP32-C3<br>Super Mini
      </button>
      <button class="hw-btn" id="btn-m5stick" onclick="selectHardware('m5stick')">
        M5StickC<br>Plus
      </button>
      <button class="hw-btn" id="btn-m5sticks3" onclick="selectHardware('m5sticks3')">
        M5Stick<br>S3
      </button>
    </div>
  </div>

  <!-- Version selector -->
  <div class="selector-group">
    <label>Version</label>
    <select id="version-select" onchange="onVersionChange()">
      <option value="">Loading versions...</option>
    </select>
  </div>

  <div class="info" id="fw-info">Select hardware and version to install.</div>

  <esp-web-install-button id="install-btn" manifest="manifest-esp32c3.json">
    <span slot="unsupported">
      Web Serial not supported. Use <strong>Chrome</strong> or <strong>Edge</strong>.
    </span>
  </esp-web-install-button>

  <div class="footer">
    <a href="https://github.com/tophe75/inclinocar" target="_blank">github.com/tophe75/inclinocar</a>
    &nbsp;·&nbsp; Chrome / Edge only
  </div>
</div>

<script>
const REPO  = 'tophe75/inclinocar';
const PAGES = 'https://tophe75.github.io/inclinocar';

// Hardware config — blOffset differs per chip family
const HW = {
  esp32c3: {
    tagPrefix:    'fw-esp32c3-',
    manifestPath: `${PAGES}/manifest-esp32c3.json`,
    label:        'ESP32-C3 Super Mini',
    chip:         'ESP32-C3',
    blOffset:     0,
  },
  m5stick: {
    tagPrefix:    'fw-m5stick-',
    manifestPath: `${PAGES}/manifest-m5stick.json`,
    label:        'M5StickC Plus',
    chip:         'ESP32',
    blOffset:     4096,
  },
  m5sticks3: {
    tagPrefix:    'fw-m5sticks3-',
    manifestPath: `${PAGES}/manifest-m5sticks3.json`,
    label:        'M5StickS3',
    chip:         'ESP32-S3',
    blOffset:     0,
  }
};

let currentHW = 'esp32c3';

function selectHardware(hw) {
  currentHW = hw;
  document.querySelectorAll('.hw-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + hw).classList.add('active');
  loadVersions();
}

async function loadVersions() {
  const sel = document.getElementById('version-select');
  sel.innerHTML = '<option value="">Loading...</option>';
  document.getElementById('fw-info').innerHTML = 'Loading versions...';

  try {
    const res  = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=50`);
    const data = await res.json();
    const hw   = HW[currentHW];

    const releases = data.filter(r => r.tag_name.startsWith(hw.tagPrefix));

    sel.innerHTML = '';
    if (releases.length === 0) {
      sel.innerHTML = '<option value="">No releases found</option>';
      document.getElementById('fw-info').innerHTML = `No ${hw.label} releases found yet.`;
      return;
    }

    releases.forEach((r, i) => {
      const opt  = document.createElement('option');
      opt.value  = JSON.stringify({
        tag:    r.tag_name,
        latest: i === 0,
        assets: r.assets.map(a => ({ name: a.name, url: a.browser_download_url }))
      });
      opt.text = r.tag_name + (i === 0 ? ' (latest)' : '');
      sel.appendChild(opt);
    });

    onVersionChange();
  } catch (e) {
    sel.innerHTML = '<option value="">Could not load versions</option>';
    document.getElementById('fw-info').innerHTML = 'Failed to load releases. Check connection.';
  }
}

function onVersionChange() {
  const sel = document.getElementById('version-select');
  if (!sel.value) return;

  const { tag, latest, assets } = JSON.parse(sel.value);
  const btn  = document.getElementById('install-btn');
  const info = document.getElementById('fw-info');
  const hw   = HW[currentHW];

  if (latest) {
    btn.setAttribute('manifest', hw.manifestPath);
    info.innerHTML = `<strong>${tag}</strong> &nbsp;<span class="badge badge-latest">latest</span><br>
      ${hw.label} — served from GitHub Pages CDN.`;
  } else {
    const manifest = buildManifest(tag, assets, hw);
    if (!manifest) {
      info.innerHTML = `<strong>${tag}</strong> — release assets not found.`;
      return;
    }
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    btn.setAttribute('manifest', URL.createObjectURL(blob));
    info.innerHTML = `<strong>${tag}</strong> &nbsp;<span class="badge badge-old">older</span><br>
      ${hw.label} — served from GitHub Release assets.`;
  }
}

function buildManifest(tag, assets, hw) {
  const find = name => assets.find(a => a.name === name)?.url;
  const bl   = find('bootloader.bin');
  const pt   = find('partitions.bin');
  const fw   = find('firmware.bin');
  const boot = find('boot_app0.bin');
  if (!bl || !pt || !fw) return null;

  const parts = [
    { path: bl, offset: hw.blOffset },
    { path: pt, offset: 32768 }
  ];
  if (boot) parts.push({ path: boot, offset: 57344 });
  parts.push({ path: fw, offset: 65536 });

  return {
    name: `InclinoCore ${hw.label}`,
    version: tag.replace(hw.tagPrefix, '').replace(/^v/, ''),
    new_install_prompt_erase: true,
    builds: [{ chipFamily: hw.chip, parts }]
  };
}

// Load on start
loadVersions();
</script>
</body>
</html>
