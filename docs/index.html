<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InclinoCar — Web Installer</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    :root {
      --green: #4caf50;
      --bg:    #0d1a0d;
      --card:  #111e11;
      --text:  #c8e6c8;
      --dim:   #5a8a5a;
      --border:#1e3a1e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-size: 2.2rem;
      font-weight: 200;
      letter-spacing: 6px;
      color: var(--green);
      margin-bottom: 8px;
    }
    .tagline {
      color: var(--dim);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .selector-group {
      text-align: left;
      margin-bottom: 16px;
    }
    .selector-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--dim);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      background: #0a120a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.9rem;
      font-family: inherit;
      appearance: none;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: var(--green); }
    .info {
      background: #0a120a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 0.82rem;
      color: var(--dim);
      line-height: 1.6;
      text-align: left;
      min-height: 40px;
    }
    .info strong { color: var(--text); }
    esp-web-install-button { display: block; margin-bottom: 16px; }
    esp-web-install-button::part(button) {
      background: #1a4a1a;
      color: var(--green);
      border: 1px solid var(--green);
      border-radius: 8px;
      padding: 14px 28px;
      font-size: 1rem;
      font-family: inherit;
      letter-spacing: 1px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    esp-web-install-button::part(button):hover { background: #254a25; }
    .footer {
      font-size: 0.75rem;
      color: var(--dim);
    }
    .footer a { color: var(--dim); }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 10px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .badge-latest { background: #1a4a1a; color: var(--green); border: 1px solid var(--green); }
    .badge-old    { background: #0a120a; color: var(--dim);   border: 1px solid var(--border); }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">INCLINOCAR</div>
  <div class="tagline">Rooftop Tent Leveling System</div>

  <div class="selector-group">
    <label>Version</label>
    <select id="version-select" onchange="onVersionChange()">
      <option value="">Loading versions...</option>
    </select>
  </div>

  <div class="info" id="fw-info">Select a version to install.</div>

  <esp-web-install-button id="install-btn" manifest="manifest.json">
    <span slot="unsupported">
      Web Serial not supported. Please use <strong>Chrome</strong> or <strong>Edge</strong>.
    </span>
  </esp-web-install-button>

  <div class="footer">
    <a href="https://github.com/tophe75/inclinocar" target="_blank">github.com/tophe75/inclinocar</a>
    &nbsp;·&nbsp; Chrome / Edge only &nbsp;·&nbsp; Hold BOOT → plug USB → release BOOT
  </div>
</div>

<script>
const REPO  = 'tophe75/inclinocar';
const PAGES = 'https://tophe75.github.io/inclinocar';

// Fetch all fw-v* and v* releases from GitHub API
async function loadVersions() {
  try {
    const res  = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=50`);
    const data = await res.json();

    // Filter to firmware releases only
    const fwReleases = data.filter(r =>
      r.tag_name.startsWith('fw-v') || r.tag_name.startsWith('v')
    );

    const sel = document.getElementById('version-select');
    sel.innerHTML = '';

    fwReleases.forEach((r, i) => {
      const opt  = document.createElement('option');
      opt.value  = JSON.stringify({
        tag:    r.tag_name,
        latest: i === 0,
        assets: r.assets.map(a => ({ name: a.name, url: a.browser_download_url }))
      });
      opt.text = r.tag_name + (i === 0 ? ' (latest)' : '');
      sel.appendChild(opt);
    });

    onVersionChange();
  } catch (e) {
    document.getElementById('version-select').innerHTML =
      '<option value="">Could not load versions</option>';
    document.getElementById('fw-info').innerHTML =
      'Failed to load releases. Check your connection.';
  }
}

function onVersionChange() {
  const sel = document.getElementById('version-select');
  if (!sel.value) return;

  const { tag, latest, assets } = JSON.parse(sel.value);
  const btn = document.getElementById('install-btn');
  const info = document.getElementById('fw-info');

  if (latest) {
    // Latest version — use GitHub Pages (fast CDN)
    btn.setAttribute('manifest', `${PAGES}/manifest.json`);
    info.innerHTML = `<strong>${tag}</strong> &nbsp;<span class="badge badge-latest">latest</span><br>
      Served from GitHub Pages CDN for fastest install.`;
  } else {
    // Older version — build manifest on the fly pointing to GitHub Release assets
    const manifest = buildManifest(tag, assets);
    if (!manifest) {
      info.innerHTML = `<strong>${tag}</strong> — release assets not found. Try a different version.`;
      return;
    }
    // Write manifest to a blob URL so esp-web-tools can fetch it
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    btn.setAttribute('manifest', url);
    info.innerHTML = `<strong>${tag}</strong> &nbsp;<span class="badge badge-old">older</span><br>
      Served from GitHub Release assets.`;
  }
}

function buildManifest(tag, assets) {
  const find = name => assets.find(a => a.name === name)?.url;
  const bl = find('bootloader.bin');
  const pt = find('partitions.bin');
  const fw = find('firmware.bin');
  if (!bl || !pt || !fw) return null;

  return {
    name: 'InclinoCar',
    version: tag.replace(/^fw-v/, '').replace(/^v/, ''),
    new_install_prompt_erase: true,
    builds: [{
      chipFamily: 'ESP32-C3',
      parts: [
        { path: bl, offset: 0 },
        { path: pt, offset: 32768 },
        { path: fw, offset: 65536 }
      ]
    }]
  };
}

loadVersions();
</script>
</body>
</html>
